shared: True

inherit: [filesystem]

metaEnvironment:
    PKG_VERSION: "16.1.0"

checkoutSCM:
    scm: url
    url: ${GITLAB_MIRROR}/api/v4/projects/4207231/packages/generic/graphviz-releases/${PKG_VERSION}/windows_10_cmake_Release_Graphviz-${PKG_VERSION}-win64.zip
    digestSHA256: 733e49626c492242eb8dca30ea627b6ead20710e207998c7933b4909d92d6abc

buildVars: [PKG_VERSION]
buildScript: |
    CopyDirectory "$($args[0])\Graphviz-${Env:PKG_VERSION}-win64" install

packageScript: |
    CopyDirectory "$($args[0])\install" usr

provideTools:
    graphviz: usr/bin
