shared: True

inherit: [cmake]

# see: https://github.com/doxygen/doxygen/issues/10262
environment:
    PARALLEL_JOBS: "1"

metaEnvironment:
    PKG_VERSION: "1_18_0"

depends:
    - name: devel::flex
      use: [tools]
    - name: devel::bison
      use: [tools]

checkoutSCM:
    scm: url
    url: ${GITHUB_MIRROR}/doxygen/doxygen/archive/refs/tags/Release_${PKG_VERSION}.zip
    digestSHA256: e99682a868afece567c22159ca18a5cdcf2822fbd4a53fb0ec653acd033c8137

buildTools: [flex, bison]
buildVars: [PKG_VERSION]
buildScript: |
    cmakeBuild -GNinja `
               -DCMAKE_BUILD_TYPE=RELEASE `
               -Dbuild_wizard=OFF `
               -Dbuild_app=OFF `
               -Dbuild_parse=OFF `
               -Dbuild_xmlparser=OFF `
               -Dbuild_search=OFF `
               -Dbuild_doc=OFF `
               -Duse_sqlite3=OFF `
               -Duse_libclang=OFF `
               -Dwin_static=ON `
               "$($args[0])\doxygen-Release_${Env:PKG_VERSION}"

packageScript: |
    cmakePackageBin

provideTools:
    doxygen: usr/bin
