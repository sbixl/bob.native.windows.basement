inherit: [msvc::layout]

# https://learn.microsoft.com/en-us/visualstudio/releases/2026/release-history
metaEnvironment:
    # Visual Studio 2026 (Version: 18.11.0, Release Date: October 13, 2026, Build Number: 12306.390)
    PKG_VERSION:      "18.11.0"
    PKG_BUILD_NUMBER: "12306.390"
    VS_BUNDLE_NAME:   "vs_2026_build_tools_12306_390_layout"

checkoutSCM:
    -
        if: !expr |
            "${SCM_VS_OFFLINE_BUNDLE_DIRECTORY}" == ""
        scm: url
        # Visual Studio 2026 BuildTools
        url: https://download.visualstudio.microsoft.com/download/pr/4ee8a2e7-bc71-435a-8180-6703ab4d2017/89341fb2edf12ef29977078fdc72a9e47767ce6895cc297f274bc4a379db4c71/vs_BuildTools.exe
        digestSHA256: "89341fb2edf12ef29977078fdc72a9e47767ce6895cc297f274bc4a379db4c71"
        extract: no
    -
        if: !expr |
            "${SCM_VS_OFFLINE_BUNDLE_DIRECTORY}" != ""
        scm: url
        url: ${SCM_VS_OFFLINE_BUNDLE_DIRECTORY}/${VS_BUNDLE_NAME}.zip
        digestSHA256: "bd1cc1708e6990f8c623775eb62c710580bad05257459bb83c5cc2db673939f7"
        extract: no

# https://learn.microsoft.com/en-us/visualstudio/install/workload-component-id-vs-build-tools?view=vs-2026
buildVars: [VS_BUNDLE_NAME]
buildScript: |
    msvcDownloadLayout $args[0] `
                       $Env:VS_BUNDLE_NAME `
                       @("--add Microsoft.VisualStudio.Workload.MSBuildTools"
                         "--add Microsoft.VisualStudio.Workload.VCTools"
                         "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64"
                         "--add Microsoft.VisualStudio.Component.VC.ATL")

multiPackage:
    layout:
        packageScript: |
            msvcPackageLayout "$($args[0])/layout"

    bundle:
        root: True
        packageVars: [VS_BUNDLE_NAME]
        packageScript: |
            msvcArchiveLayout "$($args[0])/layout" `
                              "${Env:VS_BUNDLE_NAME}"

provideVars:
    VS_VERSION: "18.11.0"
    MSVC_BUILD_TOOLS_VERSION: "14.51"
    ### Microsoft Toolset  ###
    MSVC_PLATFORM_TOOLSET: "145"
    MSVC_TOOLSET_VERSION: "14.51.36231"
    ### Microsoft C++ (MSVC) compiler version ###
    # Major.Minor
    MSVC_VERSION: "1951"
    # Major.Minor.Build
    MSVC_FULL_VERSION: "19.51.36260"
