shared: True

metaEnvironment:
    PKG_VERSION: "25.0.1"

checkoutSCM:
    scm: url
    url: ${JAVA_MIRROR}/java/GA/jdk${PKG_VERSION}/2fbf10d8c78e40bd87641c434705079d/8/GPL/openjdk-${PKG_VERSION}_windows-x64_bin.zip
    digestSHA256: "2bbae75bc31a848b7cb5f297270efb7bef9bba0deeec6a671625563dc090ad69"
    dir: openjdk
    extract: no

buildScript: |
    # Create a symlink to avoid wasting memory
    $Archive = Get-ChildItem "$($args[0])/openjdk" -File -Filter '*.zip' | Select-Object -First 1

    if (-not $Archive) {
        throw "No ZIP archive found in '$($args[0])/openjdk'"
    }

    New-Item -ItemType SymbolicLink -Force `
                                    -Path "openjdk.zip" `
                                    -Target $Archive.FullName > $null

packageToolsWeak: [7z]
packageScript: |
    $ArchivePath = "$($args[0])"

    New-Item -ItemType Directory -Path usr -Force > $null
    Check-Command { 7z x "-ousr" -y "${ArchivePath}/openjdk.zip" }

    # Because 7z has no strip option, remove the top-level directory manually
    $RootFolder = Get-ChildItem usr -Directory | Select-Object -First 1

    if ($RootFolder)
    {
        Get-ChildItem $RootFolder.FullName -Force | Copy-Item -Destination usr -Recurse -Force

        Remove-Item -LiteralPath $RootFolder.FullName -Recurse -Force
    }
    else
    {
        throw "No root directory found after extracting OpenJDK into usr."
    }

provideTools:
    java:
        path: "usr/bin"
